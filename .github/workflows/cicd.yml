name: CI

on:
  pull_request:
    branches: [ master ]

jobs:
  build_and_test:
    strategy:
      matrix:
        include:
          - vm: windows-latest
    runs-on: ${{ matrix.vm }}
    name: Build and test ${{ matrix.vm }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: xUnit tests
        shell: cmd
        run: |
          call .github\workflows\vcvars.cmd x64
          dotnet test tests\Chibil.Tests\Chibil.Tests.csproj
      - name: Build PureDOOM
        shell: cmd
        run: |
          call .github\workflows\vcvars.cmd x64
          cd samples\doom
          call build.cmd
      - name: Build PureDOOM (checksum)
        shell: cmd
        run: |
          call .github\workflows\vcvars.cmd x64
          cd samples\doom
          call build.cmd checksum
      - name: Run PureDOOM (checksum)
        shell: cmd
        run: |
          cd samples\doom\PureDOOM
          set HOME=%CD%
          ..\bin\doom.exe
