name: CI

on:
  pull_request:
    branches: [ master ]

jobs:
  build_and_test:
    strategy:
      matrix:
        include:
          - vm: windows-latest
    runs-on: ${{ matrix.vm }}
    name: Build and test ${{ matrix.vm }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: xUnit tests
        shell: cmd
        run: |
          call .github\workflows\vcvars.cmd x64
          dotnet test tests\Chibil.Tests\Chibil.Tests.csproj
      - name: xUnit tests (field-backed aggregates)
        shell: cmd
        run: |
          call .github\workflows\vcvars.cmd x64
          dotnet test tests\Chibil.Tests\Chibil.Tests.csproj -p:FieldBackedAggregateTests=true
      - name: xUnit tests (optimized)
        shell: cmd
        run: |
          call .github\workflows\vcvars.cmd x64
          dotnet test tests\Chibil.Tests\Chibil.Tests.csproj -p:OptimizedTests=true
      - name: xUnit tests (.NET Core)
        shell: cmd
        run: |
          call .github\workflows\vcvars.cmd x64
          dotnet test tests\Chibil.Tests\Chibil.Tests.csproj -p:NetCoreTests=true
      - name: xUnit tests (.NET Core, field-backed aggregates)
        shell: cmd
        run: |
          call .github\workflows\vcvars.cmd x64
          dotnet test tests\Chibil.Tests\Chibil.Tests.csproj -p:NetCoreTests=true -p:FieldBackedAggregateTests=true
      - name: xUnit tests (.NET Core, optimized)
        shell: cmd
        run: |
          call .github\workflows\vcvars.cmd x64
          dotnet test tests\Chibil.Tests\Chibil.Tests.csproj -p:NetCoreTests=true -p:OptimizedTests=true
      - name: Build PureDOOM
        shell: cmd
        run: |
          call .github\workflows\vcvars.cmd x64
          cd samples\doom
          call build.cmd
      - name: Build PureDOOM (checksum)
        shell: cmd
        run: |
          call .github\workflows\vcvars.cmd x64
          cd samples\doom
          call build.cmd checksum
      - name: Run PureDOOM (checksum)
        shell: cmd
        run: |
          cd samples\doom\PureDOOM
          set HOME=%CD%
          ..\bin\doom.exe
